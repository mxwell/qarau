syntax = "proto3";

package qarau.v1;

option go_package = "github.com/mxwell/qarau/gen/qarau/v1;qarauv1";

import "qarau/v1/complete_fetch_request.proto";
import "qarau/v1/complete_fetch_response.proto";
import "qarau/v1/job_payload.proto";
import "qarau/v1/job_type.proto";
import "qarau/v1/lease_job_request.proto";

// JobService is the worker-facing API. The fetch and asr workers are gRPC
// clients of api; they poll for work and report results here. Only api touches
// Postgres.
service JobService {
  // LeaseJob claims the oldest claimable job of the given type (SKIP LOCKED).
  rpc LeaseJob(LeaseJobRequest) returns (LeaseJobResponse);

  // Heartbeat extends a lease while a worker is still processing a job.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  rpc CompleteFetch(stream CompleteFetchRequest) returns (CompleteFetchResponse);

  // FailJob records a failure; api decides whether the job is retried.
  rpc FailJob(FailJobRequest) returns (FailJobResponse);

  // GetAudio streams a video's audio blob so the asr worker can transcribe it.
  rpc GetAudio(GetAudioRequest) returns (stream AudioChunk);
}

message Job {
  int64 id = 1;
  int64 video_id = 2;
  JobType type = 3;
  JobPayload payload = 4;
}

message LeaseJobResponse {
  Job job = 1; // unset when no job is currently available
}

message HeartbeatRequest {
  int64 job_id = 1;
  string worker_id = 2;
  uint32 progress_pct = 3;
}

message HeartbeatResponse {
  bool still_leased = 1; // false if the lease was lost (expired and reclaimed)
}

message FailJobRequest {
  int64 job_id = 1;
  string worker_id = 2;
  string error = 3;
}

message FailJobResponse {
  bool will_retry = 1; // false when attempts have been exhausted
}

message GetAudioRequest {
  int64 video_id = 1;
}

message AudioChunk {
  bytes content = 1;
  string media_type = 2; // set on the first chunk
}
