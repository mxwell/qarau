name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache onnxruntime
        uses: actions/cache@v6
        with:
          path: onnxruntime
          key: onnxruntime-${{ hashFiles('Makefile') }}

      - name: Fetch native deps
        run: make deps

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Lint
        run: make lint
